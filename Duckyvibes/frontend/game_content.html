<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duckyvibes.shop</title>
    <link rel="stylesheet" href="./CSS/games.css">
</head>
<body>
 <header>
    <div class="logo-container">
       <img src="./images/duckyvibes.png" alt="Duckyvibes Logo" class="logo" />
       <a href="./game_content.html" style="text-decoration: none; color: inherit;">
    <h1>Duckyvibes</h1>
       </a>
    </div>

     <nav class="nav_container">
        <div class="search-container">
         <input type="search" placeholder="Search " />
        
        </div>
       <div class="account-links">

         <button type="button" class="cart-btn" onclick="openPanel('cart')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6"/>
              <circle cx="10" cy="20" r="1"/>
              <circle cx="18" cy="20" r="1"/>
            </svg>
            <span class="cart-text">Cart</span>
         </button>

         <button onclick="openPanel('wishlist')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.8 8.6c0 5.5-8.8 10.4-8.8 10.4S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.4z"/>
            </svg>
            <span class="wishlist-text">Wishlist</span>
          </button>

          <button type="button" onclick="openPanel('login')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
               <circle cx="12" cy="8" r="4"/>
               <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
            </svg>
            login
          </button>

       </div>
      </nav>
      
      <div id="status-banner" class="status-banner"></div>
  </header>
  <div id="filter">
    <!--Categories-->
    <ul class="Categories">
      <li data-category="laptop">LAPTOPS</li>
      <li data-category="headset">HEADSETS</li>
      <li data-category="mouse">MOUSE</li>
      <li data-category="keyboard">KEYBOARDS</li>
      <li data-category="monitors">MONITORS</li>
      <li data-category="ram">RAM</li>
    </ul>
  </div>

     
    
    <div id="product_details">
      <h3 class="product-title">Laptops</h3><br>
      <div class="product_grid" data-category="laptop"></div><br><br>
      
     
      <h3 class="product-title">Headsets</h3><br>
      <div class="product_grid" data-category="headset"></div><br><br>
       

      <h3 class="product-title">Mouse</h3><br>
      <div class="product_grid" data-category="mouse"></div><br><br>
      

      <h3 class="product-title">Keyboards</h3><br>
      <div class="product_grid" data-category="keyboard"></div><br><br>

      <h3 class="product-title">Monitors</h3><br>
      <div class="product_grid" data-category="monitors"></div><br><br>
      
      <h3 class="product-title">RAM</h3><br> 
      <div class="product_grid" data-category="ram"></div><br><br>
    </div>

    <footer>
      <nav id="personal_container">
        <ul class="personal_links">
        <li class="mail" >info@duckyvibes.mv</li>
        <li class="Policy">Socials</li>
        <li class="contact_info">contact info: 000-000000</li>
        </ul>
      </nav>
    </footer>

    <div id="sidePanel" class="side-panel">

      <button class="close-btn" onclick="closePanel()">X</button>

      <div id="panelContent"></div>

    </div>
      

<script src="./JS/products.js"></script>  
</body>
</html>
