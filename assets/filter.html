<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duckyvibes</title>
    <link rel="stylesheet" href="./css/filter.css"> 
</head>
<body>
    <header>
      <h1>Duckyvibes</h1>
      <nav class="nav_container">
        <input type="search" placeholder=" Search">
        
       <div class="account-links">

         <button onclick="openPanel('cart')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6"/>
              <circle cx="10" cy="20" r="1"/>
              <circle cx="18" cy="20" r="1"/>
            </svg>
            My Cart
         </button>

         <button onclick="openPanel('wishlist')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.8 8.6c0 5.5-8.8 10.4-8.8 10.4S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.4z"/>
            </svg>
            Wishlist
          </button>

          <button onclick="openPanel('login')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
               <circle cx="12" cy="8" r="4"/>
               <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
            </svg>
            Account login
          </button>

       </div>
      </nav>
      
      
    </header>
    <br><br>
    <h2 id="filter-title">Filtered Products</h2>
    <br>


    <div class="products">

     <div id="sidePanel" class="side-panel">

      <button class="close-btn" onclick="closePanel()">×</button>

      <div id="panelContent"></div>

     </div>

<script src="./JS/products.js"></script>
</body>
</html>
